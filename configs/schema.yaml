# Configuration contract for reproducible LoRA experiments.

run:
  id: string
  protocol_version: string

model:
  id: string
  revision: string

data:
  concept_id: string
  dataset_version: string
  manifest: string
  subset_size: integer
  instance_prompt: string

training:
  rank: integer
  alpha: integer
  resolution: integer
  learning_rate: number
  max_train_steps: integer
  checkpointing_steps: integer
  batch_size: integer
  gradient_accumulation_steps: integer
  scheduler: string
  warmup_steps: integer
  mixed_precision: string
  train_text_encoder: boolean
  prior_preservation: boolean
  lora_dropout: number
  lora_target_modules: array
  center_crop: boolean
  random_flip: boolean
  seed: integer

inference:
  prompt_bank_version: string
  prompt_count: integer
  seeds: array
  resolution: integer
  num_inference_steps: integer
  guidance_scale: number
  scheduler: string
  negative_prompt: string
  lora_scale: number
