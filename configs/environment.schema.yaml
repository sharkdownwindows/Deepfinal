# Environment metadata contract for reproducible runs.
# This file defines the structure and allowed types of collected
# environment metadata. It is not the collected environment record.

git:
  commit: string

python:
  version: string

packages:
  torch:
    version: string
  diffusers:
    version: string
  transformers:
    version: string
  peft:
    version: string
  accelerate:
    version: string

cuda:
  available: boolean
  version: string | null

driver:
  version: string | null

gpu:
  name: string | null
  count: integer | null
  vram_mb: integer | null

platform:
  system: string
  release: string
  machine: string